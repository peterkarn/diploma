<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кава на всіх</title>
<style>
:root{--bg:#f6f1ea;--card:#fff;--ink:#2a1f17;--mute:#7a6a5c;--accent:#b5541b;--accent2:#8f4012;--ok:#2e7d4f;--oksoft:#e3f3e9;--line:#e6dccf;--soft:#fbf3e6}
@media (prefers-color-scheme:dark){:root{--bg:#1c1612;--card:#2a211b;--ink:#f3e9de;--mute:#b3a291;--accent:#e0813f;--accent2:#f09a5c;--ok:#5cc08a;--oksoft:#1f3a2a;--line:#43372d;--soft:#352a20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:24px;margin:4px 0}h2{font-size:19px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.card.hero{border:2px solid var(--accent)}
.mute{color:var(--mute);font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
textarea{resize:vertical;min-height:64px}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none}
button:hover,.btn:hover{background:var(--accent2)}
.wide{width:100%}
button.ghost,.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.link{background:none;color:var(--accent);padding:0;font-weight:500;text-decoration:underline}
button.sm{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
a{color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 150px}
.inline{display:flex;gap:8px}.inline input{flex:1;min-width:0}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent)}.bar.full>i{background:var(--ok)}
.how{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.how li{display:flex;gap:10px;align-items:flex-start}
.how>li>b{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;flex:none;margin-top:1px}
.err{color:#c0392b;font-size:14px;margin-top:6px}
.err:empty{display:none}
.tip{background:var(--soft);padding:10px 12px;border-radius:10px;font-size:14px;margin-top:10px}
.prev{display:flex;gap:12px;margin-top:14px;padding:14px;background:var(--soft);border-radius:12px}
.prev img,.item img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
.qty{display:inline-flex;align-items:center;gap:6px}.qty button{width:34px;height:34px;padding:0}.qty span{min-width:22px;text-align:center;font-weight:700}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}.item:first-child{border:0}
.item .t{flex:1;min-width:0}
.payme{margin-top:16px;padding:16px;border-radius:12px;background:var(--soft)}
.payme.ok{background:var(--oksoft)}
.sum{font-size:30px;font-weight:800;line-height:1.1}
.mono{font:700 19px ui-monospace,Menlo,monospace;letter-spacing:.5px;word-break:break-all}
.paybox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}tr:first-child td{border:0}
td.r{text-align:right;white-space:nowrap;font-weight:700}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap}.badge.ok{background:var(--ok);color:#fff}
details{margin-top:6px}summary{cursor:pointer;color:var(--mute);font-size:14px}
.adminbar{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;margin:10px 0}
.adminbar .mute{color:inherit;opacity:.75}
.adminbar input{background:rgba(255,255,255,.1);color:inherit;border-color:transparent}
.adminbar .ghost{color:inherit;border-color:rgba(255,255,255,.3)}
.hide{display:none!important}
.ac{position:relative}
.acl{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.acl:empty{display:none}
.acl button{display:block;width:100%;text-align:left;background:none;color:var(--ink);font-weight:400;border-radius:0;padding:10px 12px;border-bottom:1px solid var(--line)}
.acl button:hover{background:var(--soft)}
.np{margin-top:14px;padding:14px;border-radius:12px;background:var(--soft)}
.np label:first-child{margin-top:0}
.bm{display:inline-block;padding:8px 14px;border-radius:10px;background:#f5c518;color:#2a1f17!important;font-weight:700;text-decoration:none;cursor:grab}
.adminbar .tip{background:rgba(255,255,255,.08);color:inherit}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get(k) { try { return localStorage.getItem(k) || '' } catch { return '' } }, set(k, v) { try { localStorage.setItem(k, v) } catch { } } };
let token = ls.get('mh_token'); if (!token) { token = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g, ''); ls.set('mh_token', token); }
const app = $('#app');
const orderId = (location.pathname.match(/^\/o\/([\w-]+)/) || [])[1];
const hashKey = new URLSearchParams(location.hash.slice(1)).get('key');
if (orderId && hashKey) { ls.set('mh_key_' + orderId, hashKey); history.replaceState(null, '', location.pathname); }
const adminKey = orderId ? ls.get('mh_key_' + orderId) : '';

async function api(method, path, body) {
  const r = await fetch('/api' + path, { method, headers: { 'content-type': 'application/json', 'x-token': token, 'x-admin-key': adminKey }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Помилка ' + r.status);
  return j;
}
const money = (n, c = '₴') => (Math.round(n * 100) / 100).toLocaleString('uk-UA', { maximumFractionDigits: 2 }) + ' ' + c;
const plural = (n, a, b, c) => { const d = n % 10, h = n % 100; return d === 1 && h !== 11 ? a : (d >= 2 && d <= 4 && (h < 10 || h >= 20) ? b : c); };
const packs = n => n + ' ' + plural(n, 'пачка', 'пачки', 'пачок');
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  if (btn) { const o = btn.innerHTML; btn.textContent = 'Скопійовано ✓'; setTimeout(() => btn.innerHTML = o, 1500); }
}

/* ================= Налаштування організатора ================= */
function settingsForm(o = {}) {
  const p = o.payment || {};
  return `
  <label>Імʼя того, хто замовляє і збирає гроші</label>
  <input id="f_org" value="${esc(o.organizer || '')}" placeholder="Напр. Петро">
  <label>Номер картки для переказу</label>
  <input id="f_card" value="${esc(p.card || '')}" inputmode="numeric" placeholder="4441 1111 2222 3333">
  <label>або посилання на банку <span class="mute">(необовʼязково)</span></label>
  <input id="f_link" value="${esc(p.link || '')}" placeholder="https://send.monobank.ua/jar/…">
  ${npForm(o.np)}
  <details ${o.id ? 'open' : ''}><summary>Додатково: коментар до доставки, мінімум пачок, назва</summary>
    <label>Інша адреса або коментар до доставки</label>
    <textarea id="f_addr" placeholder="Напр. забираю з відділення у суботу">${esc(o.address || '')}</textarea>
    <label>Отримувач на картці <span class="mute">(щоб люди бачили, що переказують правильно)</span></label>
    <input id="f_holder" value="${esc(p.holder || '')}" placeholder="Петро І.">
    <label>Коментар для всіх</label>
    <input id="f_note" value="${esc(p.note || '')}" placeholder="Напр. Скидайте до пʼятниці, замовляю в суботу">
    <div class="row">
      <div><label>Мінімум пачок для опту</label><input id="f_min" type="number" min="1" value="${o.minPacks || 16}"></div>
      <div><label>Доставка всього, ₴</label><input id="f_ship" type="number" min="0" step="any" value="${o.shipping || 0}"></div>
    </div>
    <label>Назва замовлення</label><input id="f_title" value="${esc(o.title || 'Кава від MadHeads')}">
  </details>`;
}
/* ---------- Нова пошта: місто -> відділення ---------- */
let npSel = {};
function npForm(np) {
  npSel = { ...(np || {}) };
  return `<div class="np">
    <label>📦 Куди MadHeads відправить посилку (Нова пошта)</label>
    <div class="ac"><input id="np_city" value="${esc(npSel.city || '')}" placeholder="Почніть вводити місто" autocomplete="off"><div class="acl" id="np_city_l"></div></div>
    <div class="ac" style="margin-top:8px"><input id="np_wh" value="${esc(npSel.warehouse || '')}" placeholder="Номер відділення / поштомату або вулиця" autocomplete="off" ${npSel.cityRef ? '' : 'disabled'}><div class="acl" id="np_wh_l"></div></div>
    <div class="row">
      <div><label>Отримувач (ПІБ)</label><input id="np_rec" value="${esc(npSel.recipient || '')}" placeholder="Петренко Петро"></div>
      <div><label>Телефон отримувача</label><input id="np_phone" type="tel" value="${esc(npSel.phone || '')}" placeholder="+380…"></div>
    </div>
    <div class="err" id="np_err"></div></div>`;
}
function bindNp() {
  const city = $('#np_city'), wh = $('#np_wh');
  if (!city) return;
  let t1, t2;
  const list = (box, items, pick) => {
    box.innerHTML = items.length ? items.map((it, i) => `<button type="button" data-i="${i}">${esc(it.name)}</button>`).join('') : '';
    $$('button', box).forEach(b => b.onmousedown = e => { e.preventDefault(); pick(items[+b.dataset.i]); box.innerHTML = ''; });
  };
  const load = async (path, box, pick) => {
    try { $('#np_err').textContent = ''; list(box, await api('GET', path), pick); }
    catch (e) { $('#np_err').textContent = e.message; }
  };
  const loadWh = () => load(`/np/warehouses?city=${npSel.cityRef}&q=${encodeURIComponent(wh.value.trim())}`, $('#np_wh_l'), w => { npSel.warehouse = w.name; npSel.warehouseRef = w.ref; wh.value = w.name; });
  city.oninput = () => {
    npSel = {}; wh.value = ''; wh.disabled = true;
    clearTimeout(t1); t1 = setTimeout(() => load('/np/cities?q=' + encodeURIComponent(city.value.trim()), $('#np_city_l'),
      c => { npSel.city = c.name; npSel.cityRef = c.ref; city.value = c.name; wh.disabled = false; wh.focus(); }), 300);
  };
  wh.oninput = () => { delete npSel.warehouseRef; clearTimeout(t2); t2 = setTimeout(loadWh, 300); };
  wh.onfocus = () => { if (npSel.cityRef && !npSel.warehouseRef) loadWh(); };
  [city, wh].forEach(i => i.onblur = () => setTimeout(() => { $('#np_city_l').innerHTML = ''; $('#np_wh_l').innerHTML = ''; }, 150));
}

function readSettings() {
  return { title: $('#f_title').value, organizer: $('#f_org').value, address: $('#f_addr').value, np: npSel.warehouseRef ? { ...npSel, recipient: $('#np_rec').value, phone: $('#np_phone').value } : null, minPacks: $('#f_min').value, shipping: $('#f_ship').value, currency: '₴',
    payment: { card: $('#f_card').value, holder: $('#f_holder').value, link: $('#f_link').value, note: $('#f_note').value } };
}

/* ================= Головна: створити замовлення ================= */
function renderHome() {
  app.innerHTML = `
  <h1>☕ Кава на всіх</h1>
  <p class="mute">Спільне оптове замовлення кави MadHeads з друзями — без переписок «скільки я винен і куди кидати».</p>
  <div class="card">
    <h2>Як це працює</h2>
    <ol class="how">
      <li><b>1</b><div>Ви вказуєте, кому скидати гроші, — і отримуєте <b>посилання</b>.</div></li>
      <li><b>2</b><div>Кидаєте його друзям у чат. Кожен вставляє посилання на свою каву з MadHeads і бачить, <b>скільки і куди скинути</b>.</div></li>
      <li><b>3</b><div>Ви бачите, хто що бере, скільки пачок набрано, і відмічаєте, хто вже оплатив.</div></li>
    </ol>
  </div>
  <div class="card hero">
    <h2>Створити замовлення</h2>
    ${settingsForm()}
    <button id="create" class="wide" style="margin-top:16px">Створити й отримати посилання →</button>
    <div class="err" id="err"></div>
  </div>
  <p class="mute">Вам надіслали посилання? Просто відкрийте його — тут нічого створювати не треба.</p>`;
  bindNp();
  $('#create').onclick = async e => {
    e.target.disabled = true;
    try {
      if ($('#np_city').value.trim() && !npSel.warehouseRef) throw new Error('Оберіть відділення Нової пошти зі списку (або зітріть місто).');
      const s = readSettings();
      if (!s.organizer.trim()) throw new Error('Вкажіть імʼя того, хто замовляє.');
      if (!s.payment.card.trim() && !s.payment.link.trim()) throw new Error('Вкажіть картку або посилання на банку — інакше друзі не знатимуть, куди скидати.');
      const r = await api('POST', '/orders', s);
      ls.set('mh_key_' + r.id, r.adminKey);
      ls.set('mh_new_' + r.id, '1');
      location.href = `/o/${r.id}#key=${r.adminKey}`;
    } catch (er) { $('#err').textContent = er.message; e.target.disabled = false; }
  };
}

/* ================= Сторінка замовлення ================= */
let order = null, preview = null, editing = false, busy = false, renaming = false;
const myName = () => ls.get('mh_name_' + orderId) || ls.get('mh_name');

function calc(o) {
  const by = {};
  for (const i of o.items) { const p = (by[i.person] ||= { name: i.person, items: [], packs: 0, sum: 0 }); p.items.push(i); p.packs += i.qty; p.sum += i.qty * i.price; }
  const list = Object.values(by);
  const total = list.reduce((s, p) => s + p.packs, 0), sum = list.reduce((s, p) => s + p.sum, 0);
  list.forEach(p => { p.ship = total ? o.shipping * p.packs / total : 0; p.pay = Math.ceil(p.sum + p.ship); });
  return { list, total, sum };
}

function summaryText(o, c) {
  const agg = {};
  o.items.forEach(i => { (agg[i.name] ||= { qty: 0, url: i.url }).qty += i.qty; });
  return `${o.title}: ${packs(c.total)}, ${money(c.sum + o.shipping)}\n\nЩО ЗАМОВЛЯТИ:\n` +
    Object.entries(agg).map(([n, a]) => `• ${n} — ${a.qty} шт.${a.url ? '\n  ' + a.url : ''}`).join('\n') +
    '\n\nХТО СКІЛЬКИ СКИДАЄ:\n' + c.list.map(p => `• ${p.name}: ${packs(p.packs)} → ${money(p.pay)}${o.paid[p.name] ? ' ✓ оплачено' : ''}`).join('\n');
}

function renderOrder() {
  const o = order, c = calc(o), name = myName();
  document.title = o.title;
  const left = o.minPacks - c.total, pct = Math.min(100, Math.round(c.total / o.minPacks * 100));
  const me = name && c.list.find(p => p.name.toLowerCase() === name.toLowerCase());
  const myItems = o.items.filter(i => i.mine);
  const link = location.origin + '/o/' + o.id;
  const isNew = ls.get('mh_new_' + o.id);

  app.innerHTML = `
  ${o.isAdmin ? adminBar(o, c, link, isNew) : ''}

  <div class="top"><h1>☕ ${esc(o.title)}</h1></div>
  <div class="mute">Збирає і замовляє: <b>${esc(o.organizer)}</b></div>
  <div class="bar ${left <= 0 ? 'full' : ''}"><i style="width:${pct}%"></i></div>
  <div class="mute">${left > 0 ? `Набрано ${packs(c.total)} з ${o.minPacks} — бракує ще <b>${packs(left)}</b> до оптової ціни` : `🎉 Набрано ${packs(c.total)} — мінімум для опту є!`}</div>

  <div class="tip">💡 Усі ціни — <b>оптові</b> (від ${o.minPacks} пачок на всіх). Вони діють, коли разом набереться ${packs(o.minPacks)}.</div>

  <div class="card hero">
    ${!name || renaming ? `
      <h2>Як вас звати?</h2>
      <p class="mute" style="margin:0">Щоб ${esc(o.organizer)} знав(-ла), чия це кава і від кого переказ.</p>
      <div class="inline" style="margin-top:10px"><input id="name" value="${esc(name)}" placeholder="Ваше імʼя" autocomplete="given-name"><button id="saveName">Далі →</button></div>
      <div class="err" id="err"></div>`
    : `
      <div class="top"><h2>${myItems.length ? 'Ваша кава' : 'Що берете, ' + esc(name) + '?'}</h2><button class="link sm" id="rename">Я не ${esc(name)}</button></div>
      ${myItems.length ? `<div>${myItems.map(i => itemRow(i, true)).join('')}</div>` : ''}
      ${addCoffee(myItems.length)}
      ${me ? payBlock(o, me) : ''}`}
  </div>

  ${c.list.length ? `<div class="card">
    <h2>Усе замовлення</h2>
    <table>${c.list.map(p => `<tr><td><b>${esc(p.name)}</b> <span class="mute">${packs(p.packs)}</span>
        <details><summary>що бере</summary>${p.items.map(i => itemRow(i, o.isAdmin && !i.mine)).join('')}${p.ship ? `<div class="mute">+ доставка ${money(p.ship)}</div>` : ''}</details></td>
      <td class="r">${money(p.pay)}<br>${o.paid[p.name] ? '<span class="badge ok">оплачено</span>' : '<span class="badge">не оплачено</span>'}
        ${o.isAdmin ? `<br><button class="link sm" data-paid="${esc(p.name)}" data-v="${o.paid[p.name] ? 0 : 1}">${o.paid[p.name] ? 'зняти' : 'отримав ✓'}</button>` : ''}</td></tr>`).join('')}
      <tr><td><b>Разом</b> <span class="mute">${packs(c.total)}</span></td><td class="r">${money(c.sum + o.shipping)}</td></tr>
    </table></div>` : ''}

  ${o.np || o.address ? `<div class="card"><h2>Куди приїде посилка</h2>
    ${o.np ? `<div>📦 Нова пошта: <b>${esc(o.np.city)}</b></div><div>${esc(o.np.warehouse)}</div>${o.np.recipient ? `<div class="mute">Отримувач: ${esc(o.np.recipient)}${o.np.phone ? ', ' + esc(o.np.phone) : ''}</div>` : ''}` : ''}
    ${o.address ? `<div style="margin-top:6px">${esc(o.address).replace(/\n/g, '<br>')}</div>` : ''}<p class="mute" style="margin-bottom:0">Звідти ${esc(o.organizer)} роздасть каву.</p></div>` : ''}
  ${!o.isAdmin ? `<p class="mute" style="text-align:center">Це ви збираєте замовлення? <a href="/">Створити своє</a></p>` : ''}`;
  bind();
}

function adminBar(o, c, link, isNew) {
  return `<div class="adminbar">
    <div><b>${isNew ? '✅ Замовлення створено! ' : ''}Ви організатор.</b> ${isNew ? 'Тепер надішліть це посилання друзям у чат:' : 'Посилання для друзів:'}</div>
    <div class="inline" style="margin-top:8px"><input readonly value="${esc(link)}" onclick="this.select()"><button id="cplink">Скопіювати</button></div>
    <div class="row" style="margin-top:10px">
      <button class="ghost sm" id="cpsum">📋 Зведення для замовлення</button>
      <button class="ghost sm" id="edit">⚙ Картка, адреса…</button>
      <button class="ghost sm" id="cpadmin">🔑 Посилання організатора</button>
      <button class="ghost sm" id="refresh">🔄 Оновити ціни з сайту</button>
      <button class="ghost sm" id="cartbtn">🛒 Закинути все в кошик MadHeads</button>
    </div>
    <div id="cartbox" class="hide">${cartBox(o)}</div>
    <div class="mute" style="margin-top:8px;font-size:13px">«Посилання організатора» — щоб відкрити цю панель з іншого пристрою або передати її тому, хто замовлятиме. Друзям його не давайте.</div>
    <div id="editbox" class="${editing ? '' : 'hide'}" style="margin-top:6px">${settingsForm(o)}<button id="saveset" style="margin-top:12px">Зберегти</button><div class="err" id="err2"></div></div>
  </div>`;
}

function cartPlan(o) {
  const by = {}, bad = [];
  for (const i of o.items) {
    const slug = (String(i.url).match(/madheadscoffee\.com\/(?:[a-z]{2}\/)?p\/([\w-]+)/) || [])[1];
    if (slug) by[slug] = (by[slug] || 0) + i.qty; else bad.push(i.name);
  }
  const list = Object.entries(by);
  const code = "(async()=>{if(!/madheadscoffee\\.com$/.test(location.hostname)){alert('Спершу відкрийте сайт madheadscoffee.com, а тоді натисніть ще раз');return}" +
    "const L=" + JSON.stringify(list) + ";let n=0;for(const[s,c]of L){try{const r=await(await fetch('/api',{method:'POST',body:JSON.stringify({method:'cart.change',params:{slug:s,count:c,options:{}}})})).json();if(r.ok)n++}catch(e){}}" +
    "alert('У кошику '+n+' з '+L.length+' позицій. Відкриваю оформлення.');location.href='/checkout'})()";
  return { list, bad, code };
}
function cartBox(o) {
  const c = cartPlan(o);
  if (!c.list.length) return '<div class="tip" style="margin-top:10px">Поки нічого переносити — ніхто не додав каву з сайту MadHeads.</div>';
  return `<div class="tip" style="margin-top:10px">
    <b>Як перенести ${c.list.length} позицій (${packs(c.list.reduce((s, x) => s + x[1], 0))}) у кошик MadHeads:</b>
    <ol style="margin:8px 0;padding-left:20px">
      <li>Перетягніть цю жовту кнопку на панель закладок браузера: <a class="bm" href="${esc('javascript:' + encodeURIComponent(c.code))}" onclick="alert('Тут не натискайте — перетягніть кнопку на панель закладок, а натисніть її вже на сайті MadHeads.');return false">☕ Кава → кошик</a></li>
      <li>Відкрийте <a href="https://madheadscoffee.com" target="_blank" rel="noopener" style="color:inherit">madheadscoffee.com</a> і натисніть цю закладку.</li>
      <li>Уся кава зʼявиться в кошику, і відкриється оформлення.</li>
    </ol>
    <div>Не виходить із закладкою? На сайті MadHeads натисніть F12 → вкладка Console, вставте код і натисніть Enter: <button class="ghost sm" id="cpcode">Скопіювати код</button></div>
    <div style="margin-top:6px;opacity:.75">Кількість кожної кави в кошику стане такою, як тут. Якщо список зміниться — просто натисніть закладку ще раз (стару закладку замініть новою).</div>
    ${c.bad.length ? `<div style="margin-top:6px">⚠️ Додайте вручну (немає посилання на MadHeads): ${c.bad.map(esc).join(', ')}</div>` : ''}
  </div>`;
}

function itemRow(i, editable) {
  return `<div class="item">${i.image ? `<img src="${esc(i.image)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
    <div class="t">${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.name)}</a>` : esc(i.name)}
      <div class="mute">${i.qty} × ${money(i.price)}${i.retail > i.price ? ` <s>${money(i.retail)}</s>` : ''} = ${money(i.qty * i.price)}</div></div>
    ${editable ? `<div class="qty"><button class="ghost" data-q="${i.id}:${i.qty - 1}" ${i.qty <= 1 ? 'disabled' : ''}>−</button><span>${i.qty}</span><button class="ghost" data-q="${i.id}:${i.qty + 1}">+</button><button class="ghost" data-del="${i.id}" title="Прибрати">✕</button></div>` : ''}</div>`;
}

function addCoffee(hasItems) {
  if (preview) return `<div class="prev">${preview.image ? `<img src="${esc(preview.image)}" alt="" onerror="this.remove()">` : ''}
    <div style="flex:1;min-width:0">
      <label style="margin-top:0">Кава</label><input id="pv_name" value="${esc(preview.name)}" placeholder="Назва кави">
      <div class="row">
        <div><label>Оптова ціна за пачку, ₴${preview.retail > preview.price ? ` <span class="mute">(роздріб ${money(preview.retail)})</span>` : ''}</label><input id="pv_price" type="number" min="0" step="any" value="${preview.price || ''}" placeholder="0"></div>
        <div><label>Скільки пачок</label><div class="qty"><button class="ghost" id="qm">−</button><span id="pv_qty">${preview.qty}</span><button class="ghost" id="qp">+</button></div></div>
      </div>
      ${preview.warning ? `<div class="tip">⚠️ ${esc(preview.warning)}</div>` : ''}
      <div class="row" style="margin-top:14px"><button id="add">Додати</button><button class="ghost" id="cancel" style="flex:0 0 auto">Скасувати</button></div>
      <div class="err" id="err3"></div>
    </div></div>`;
  return `
    ${hasItems ? '<label>Додати ще одну каву</label>' : `<ol class="how" style="margin-bottom:12px">
      <li><b>1</b><div>Відкрийте сайт MadHeads і знайдіть каву, яку хочете.</div></li>
      <li><b>2</b><div>Скопіюйте адресу сторінки з рядка браузера (або «Поділитися → Копіювати»).</div></li>
      <li><b>3</b><div>Вставте її сюди 👇</div></li></ol>`}
    <div class="inline"><input id="url" placeholder="Вставте посилання на каву" inputmode="url"><button id="fetch">Додати</button></div>
    <div class="err" id="err"></div>`;
}

function payBlock(o, me) {
  const p = o.payment, paid = o.paid[me.name];
  if (paid) return `<div class="payme ok"><div class="sum">✓ ${money(me.pay)} оплачено</div><div class="mute">${esc(o.organizer)} підтвердив(-ла) переказ. Дякуємо!</div></div>`;
  return `<div class="payme">
    <div class="mute">Вам скинути ${esc(o.organizer)}</div>
    <div class="sum">${money(me.pay)}</div>
    <div class="mute">${packs(me.packs)}${me.ship ? ` · з них доставка ${money(me.ship)}` : ''}</div>
    ${p.card ? `<div class="paybox"><span class="mono">${esc(p.card)}</span><button class="sm" data-copy="${esc(p.card.replace(/\s/g, ''))}">Копіювати картку</button></div>` : ''}
    ${p.holder ? `<div class="mute">Отримувач: ${esc(p.holder)}</div>` : ''}
    ${p.link ? `<div class="paybox"><a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">Оплатити через банку →</a></div>` : ''}
    ${!p.card && !p.link ? '<div class="tip">Організатор ще не вказав, куди скидати. Зазирніть сюди трохи пізніше.</div>' : ''}
    ${p.note ? `<div class="tip">💬 ${esc(p.note)}</div>` : ''}
    <div class="mute" style="margin-top:8px">${money(me.pay)} — у коментарі до переказу напишіть «${esc(me.name)}, кава». Коли ${esc(o.organizer)} отримає, тут зʼявиться «оплачено».</div>
  </div>`;
}

function bind() {
  const o = order;
  const nameInput = $('#name');
  if (nameInput) {
    const go = () => { const v = nameInput.value.trim(); if (!v) { $('#err').textContent = 'Напишіть імʼя.'; return; } ls.set('mh_name_' + o.id, v); ls.set('mh_name', v); renaming = false; renderOrder(); $('#url')?.focus(); };
    $('#saveName').onclick = go; nameInput.onkeydown = e => { if (e.key === 'Enter') go(); };
  }
  $('#rename') && ($('#rename').onclick = () => { renaming = true; renderOrder(); $('#name').focus(); });
  if ($('#fetch')) {
    $('#fetch').onclick = doPreview;
    $('#url').onkeydown = e => { if (e.key === 'Enter') doPreview(); };
    $('#url').onpaste = () => setTimeout(doPreview, 50); // вставили — одразу підтягуємо
  }
  if (preview) {
    const set = d => { preview.qty = Math.min(100, Math.max(1, preview.qty + d)); $('#pv_qty').textContent = preview.qty; };
    $('#qm').onclick = () => set(-1); $('#qp').onclick = () => set(1);
    $('#cancel').onclick = () => { preview = null; renderOrder(); };
    $('#add').onclick = async () => {
      try { order = await api('POST', `/orders/${o.id}/items`, { person: myName(), retail: preview.retail, url: preview.url, image: preview.image, name: $('#pv_name').value, price: $('#pv_price').value, qty: preview.qty }); preview = null; renderOrder(); }
      catch (er) { $('#err3').textContent = er.message; }
    };
    if (!preview.price) $('#pv_price').focus();
  }
  $$('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy, b));
  $$('[data-del]').forEach(b => b.onclick = () => confirm('Прибрати цю каву?') && act(() => api('DELETE', `/orders/${o.id}/items/${b.dataset.del}`)));
  $$('[data-q]').forEach(b => b.onclick = () => { const [id, q] = b.dataset.q.split(':'); if (+q >= 1) act(() => api('PATCH', `/orders/${o.id}/items/${id}`, { qty: +q })); });
  $$('[data-paid]').forEach(b => b.onclick = () => act(() => api('POST', `/orders/${o.id}/paid`, { person: b.dataset.paid, paid: b.dataset.v === '1' })));
  if (o.isAdmin) {
    const link = location.origin + '/o/' + o.id;
    $('#cplink').onclick = e => { copy(link, e.target); ls.set('mh_new_' + o.id, ''); };
    $('#cpadmin').onclick = e => copy(`${link}#key=${adminKey}`, e.target);
    $('#refresh').onclick = async e => { e.target.disabled = true; e.target.textContent = 'Оновлюю…'; try { const r = await api('POST', `/orders/${o.id}/refresh`); delete r.updated; order = r; renderOrder(); } catch (er) { alert(er.message); e.target.disabled = false; } };
    $('#cartbtn').onclick = () => $('#cartbox').classList.toggle('hide');
    $('#cpcode') && ($('#cpcode').onclick = e => copy(cartPlan(o).code, e.target));
    $('#cpsum').onclick = e => copy(summaryText(o, calc(o)), e.target);
    $('#edit').onclick = () => { editing = !editing; $('#editbox').classList.toggle('hide', !editing); };
    bindNp();
    $('#saveset').onclick = async () => { try { order = await api('PUT', '/orders/' + o.id, readSettings()); editing = false; renderOrder(); } catch (er) { $('#err2').textContent = er.message; } };
  }
}

async function doPreview() {
  const input = $('#url'), b = $('#fetch'), url = input.value.trim();
  $('#err').textContent = '';
  if (!url) { $('#err').textContent = 'Вставте посилання на сторінку кави з сайту MadHeads.'; return; }
  if (b.disabled) return;
  b.disabled = true; b.textContent = 'Шукаю…';
  try { preview = { ...(await api('POST', '/preview', { url })), qty: 1 }; renderOrder(); }
  catch (er) { $('#err').textContent = er.message; b.disabled = false; b.textContent = 'Додати'; }
}

async function act(fn) { if (busy) return; busy = true; try { order = await fn(); renderOrder(); } catch (e) { alert(e.message); } busy = false; }

async function load() {
  try { order = await api('GET', '/orders/' + orderId); renderOrder(); }
  catch (e) { app.innerHTML = `<div class="card"><h2>Замовлення не знайдено</h2><p>${esc(e.message)}</p><a class="btn" href="/">Створити нове</a></div>`; return; }
  setInterval(async () => {
    const a = document.activeElement;
    if (busy || editing || preview || renaming || (a && /INPUT|TEXTAREA/.test(a.tagName) && a.value && !a.readOnly)) return;
    try { const n = await api('GET', '/orders/' + orderId); if (JSON.stringify(n) !== JSON.stringify(order)) { order = n; renderOrder(); } } catch { }
  }, 5000);
}

orderId ? load() : renderHome();
</script>
</body>
</html>
